services:
  - type: web
    name: pm-kanban
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MVP_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
